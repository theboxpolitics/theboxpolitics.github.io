<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Box Politics</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #F5DDC4;
            --text: #62401E;
            --accent: #ECC398;
            --secondary: #DAC4AD;
            --white: #FFFFFF;
            --transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .logo-img {
            height: 45px;
            width: auto;
            object-fit: contain;
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: 1.4rem;
            text-transform: uppercase;
            color: var(--text);
        }

        /* Menu Button */
        .menu-btn {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 7px;
            z-index: 1001;
        }

        .menu-btn span {
            display: block;
            width: 30px;
            height: 2px;
            background: var(--text);
            transition: var(--transition);
        }

        #menu-overlay {
            position: fixed;
            top: 80px;
            left: 0;
            width: 100%;
            height: calc(100% - 80px);

            /* We'll set the actual color in JS, but this ensures blur works */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;

            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: var(--transition);
        }

        #menu-overlay.open {
            opacity: 1;
            /* Keep this at 1 so text is solid */
            visibility: visible;
            transform: translateY(0);
        }

        .menu-link {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            color: var(--white);
            /* This makes the links solid white */
            text-decoration: none;
            margin: 1rem 0;
            transition: var(--transition);
            opacity: 1 !important;
            /* Forces text to stay opaque */
        }

        .menu-link:hover {
            color: var(--accent);
            transform: translateY(-5px);
        }

        /* Ensure the Nav bar stays on top and has a solid background */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: 80px;
            /* Fixed height to match the overlay offset */
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1001;
            background-color: var(--bg);
            /* Keep the header area Cream */
            border-bottom: 1px solid var(--secondary);
        }

        /* Menu Button behavior */
        .menu-btn {
            position: relative;
            z-index: 1002;
            cursor: pointer;
        }

        /* Animation: Turn the lines into an X when open */
        .menu-btn span {
            color: var(--accent);
        }

        .open-btn span:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }

        .open-btn span:nth-child(2) {
            transform: translateY(-2px) rotate(-45deg);
        }


        /* Layout Content */
        #content {
            transition: opacity 0.4s ease;
        }

        .fade-out {
            opacity: 0;
        }

        /* Home View (Centered Hero) */
        .hero {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 12vw, 8rem);
            font-weight: 900;
            text-transform: uppercase;
            border-bottom: 4px solid var(--text);
            margin-bottom: 1.5rem;
        }

        .hero h3 {
            font-size: clamp(0.9rem, 2.5vw, 1.4rem);
            letter-spacing: 5px;
            opacity: 0.8;
            font-weight: 300;
        }

        /* Article View (Scrollable) */
        .article {
            max-width: 800px;
            margin: 150px auto 100px;
            padding: 0 2rem;
        }

        .article h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 6vw, 4rem);
            margin-bottom: 2rem;
        }

        .article hr {
            border: none;
            height: 1px;
            background: var(--secondary);
            margin: 80px 0;
        }

        .founder-card {
            display: flex;
            gap: 40px;
            align-items: center;
            margin-top: 40px;
        }

        .founder-img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border: 1px solid var(--secondary);
        }

        @media (max-width: 768px) {
            .founder-card {
                flex-direction: column;
            }

            .logo-text {
                display: none;
            }
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo-container" onclick="loadPage('home')">
            <img src="logo.png" alt="Logo" class="logo-img">
            <span class="logo-text" id="site-title"></span>
        </div>
        <div class="menu-btn" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </nav>
    <div id="menu-overlay" onclick="toggleMenu()">
        <a href="#" class="menu-link" onclick="loadPage('home')">Front Page</a>
        <a href="#" class="menu-link" onclick="loadPage('about')">The Mission</a>
        <a href="#" class="menu-link" onclick="loadPage('socials')">Socials</a>
    </div>
    <main id="content"></main>

    <script>
        let config = {};
        async function init() {
            try {
                const response = await fetch('config.json');
                config = await response.json();

                const root = document.documentElement;
                const colors = config.colors;

                // Apply standard colors
                root.style.setProperty('--bg', colors.bg);
                root.style.setProperty('--text', colors.primary); // Mapping 'primary' to '--text'
                root.style.setProperty('--accent', colors.accent);
                root.style.setProperty('--secondary', colors.secondary);
                root.style.setProperty('--white', colors.white);

                // --- THE TRANSPARENT OVERLAY LOGIC ---
                // Takes #62401E and adds '80' for 50% transparency
                const transparentPrimary = colors.primary + "DD";
                const overlay = document.getElementById('menu-overlay');
                overlay.style.backgroundColor = transparentPrimary;
                // -------------------------------------

                document.getElementById('site-title').innerText = config.siteName;
                loadPage('home');
            } catch (e) { console.error(e); }
        }
        function toggleMenu() { document.getElementById('menu-overlay').classList.toggle('open'); }
        async function loadPage(p) {
            const c = document.getElementById('content');
            c.classList.add('fade-out');
            const res = await fetch(`${p}.md`);
            const md = await res.text();
            setTimeout(() => {
                const html = marked.parse(md);
                if (p === 'home') {
                    c.innerHTML = `<section class="hero"><h1>${config.siteName}</h1><h3>${config.slogan}</h3></section>`;
                    document.body.style.overflow = 'hidden';
                } else if (p === 'socials') {
                    const handle = config.instagram.split('/').filter(Boolean).pop();
                    c.innerHTML = `<section class="article"><h1>CONTACT</h1>${html}<div style="margin-top:50px"><p>EMAIL: <a href="mailto:${config.email}" style="color:inherit; font-weight:bold;">${config.email}</a></p><p>INSTAGRAM: <a href="${config.instagram}" target="_blank" style="color:inherit; font-weight:bold;">@${handle}</a></p></div></section>`;
                    document.body.style.overflow = 'auto';
                } else {
                    //c.innerHTML = `<section class="article">${html}<hr><h2>WHO WE ARE</h2><div class="founder-card"><img src="founder.png" class="founder-img"><div><h3>${config.founderName}</h3><p><strong>${config.founderRole}</strong></p><p>${config.founderBio}</p></div></div></section>`;
                    c.innerHTML = `<section class="article">${html}<hr></section>`;
                    document.body.style.overflow = 'auto';
                }
                c.classList.remove('fade-out');
            }, 400);
        }
        init();
    </script>
</body>

</html>
