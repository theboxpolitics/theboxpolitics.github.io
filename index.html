<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Box Politics</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg: #0a0a0a;
            --text: #e0e0e0;
            --accent: #ffffff;
            --transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Nav */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        .logo-img {
            height: 40px;
            width: auto;
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: 1.4rem;
            text-transform: uppercase;
        }

        .menu-btn {
            cursor: pointer;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1001;
        }

        .menu-btn span {
            display: block;
            width: 35px;
            height: 1px;
            background: var(--accent);
            transition: var(--transition);
        }

        /* Overlay */
        #menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.98);
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        #menu-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .menu-link {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 8vw, 4rem);
            color: var(--text);
            text-decoration: none;
            margin: 1rem 0;
            transition: var(--transition);
            border-bottom: 2px solid transparent;
        }

        .menu-link:hover {
            opacity: 0.7;
            transform: translateY(-5px);
            border-bottom: 2px solid var(--accent);
        }

        /* Sections */
        #content {
            transition: opacity 0.4s ease;
        }

        .fade-out {
            opacity: 0;
        }

        /* Home */
        .hero {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3.5rem, 12vw, 8rem);
            font-weight: 900;
            text-transform: uppercase;
            line-height: 0.9;
            margin-bottom: 1.5rem;
            border-bottom: 3px solid var(--accent);
        }

        .hero h3 {
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 300;
            opacity: 0.8;
        }

        /* Article/About */
        .article {
            max-width: 850px;
            margin: 150px auto 100px;
            padding: 0 2rem;
        }

        .article h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 8vw, 4rem);
            margin-bottom: 3rem;
        }

        .article hr {
            border: none;
            height: 1px;
            background: #333;
            margin: 80px 0;
        }

        .founder-card {
            display: flex;
            gap: 40px;
            align-items: center;
            margin-top: 40px;
        }

        .founder-img {
            width: 250px;
            height: 300px;
            object-fit: cover;
            filter: grayscale(100%);
            border: 1px solid #333;
        }

        @media (max-width: 768px) {
            .founder-card {
                flex-direction: column;
                text-align: left;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo-container" onclick="loadPage('home')">
            <img src="logo.png" alt=" " class="logo-img">
            <span class="logo-text" id="dynamic-site-name"></span>
        </div>
        <div class="menu-btn" onclick="toggleMenu(event)">
            <span></span><span></span>
        </div>
    </nav>

    <div id="menu-overlay" onclick="toggleMenu(event)">
        <a href="#" class="menu-link" onclick="loadPage('home')">Front Page</a>
        <a href="#" class="menu-link" onclick="loadPage('about')">The Mission</a>
        <a href="#" class="menu-link" onclick="loadPage('socials')">Socials</a>
    </div>

    <main id="content"></main>

    <script>
        let siteConfig = {};

        // Fetch the config once when site starts
        async function init() {
            try {
                const response = await fetch('config.json');
                siteConfig = await response.json();
                document.getElementById('dynamic-site-name').innerText = siteConfig.siteName;
                loadPage('home');
            } catch (e) { console.error("Config missing", e); }
        }

        function toggleMenu(event) {
            document.getElementById('menu-overlay').classList.toggle('open');
        }

        async function loadPage(page) {
            const contentDiv = document.getElementById('content');
            contentDiv.classList.add('fade-out');

            try {
                // Socials doesn't actually need an MD file if we want it fully dynamic 
                // but we fetch it anyway to allow for custom text.
                const response = await fetch(`${page}.md`);
                const mdText = await response.text();

                setTimeout(() => {
                    let htmlContent = marked.parse(mdText);

                    if (page === 'home') {
                        contentDiv.innerHTML = `
                        <section class="hero">
                            <h1>${siteConfig.siteName}</h1>
                            <h3>${siteConfig.slogan}</h3>
                        </section>`;
                        document.body.style.overflow = 'hidden';
                    } else if (page === 'socials') {
                        const instaLink = siteConfig.instagram.replace(/\/$/, "");
                        const handle = instaLink.substring(instaLink.lastIndexOf("/") + 1);
                        contentDiv.innerHTML = `
                        <section class="article">
                            <h1>CONNECT</h1>
                            ${htmlContent}
                            <div style="margin-top: 50px; font-family: 'Playfair Display', serif;">
                                <div style="margin-bottom: 30px;">
                                    <span style="font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.8;">Email:</span>
                                    <a href="mailto:${siteConfig.email}" class="menu-link" style="font-size: clamp(1.5rem, 5vw, 2.5rem); display: inline-block; margin: 0; border: none; padding-left: 10px;">
                                        ${siteConfig.email}
                                    </a>
                                </div>
                                
                                <div>
                                    <span style="font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.8;">Instagram:</span>
                                    <a href="${siteConfig.instagram}" target="_blank" class="menu-link" style="font-size: clamp(1.5rem, 5vw, 2.5rem); display: inline-block; margin: 0; border: none; padding-left: 10px;">
                                        @${handle}
                                    </a>
                                </div>
                            </div>
                        </section>`;
                        document.body.style.overflow = 'auto';
                    } else {
                        contentDiv.innerHTML = `
                        <section class="article">
                            ${htmlContent}
                            <hr>
                            <h2>WHO WE ARE</h2>
                            <div class="founder-card">
                                <img src="founder.png" class="founder-img" alt="Founder">
                                <div>
                                    <h3>${siteConfig.founderName}</h3>
                                    <p><strong>${siteConfig.founderRole}</strong></p>
                                    <p>${siteConfig.founderBio}</p>
                                </div>
                            </div>
                        </section>`;
                        document.body.style.overflow = 'auto';
                    }
                    contentDiv.classList.remove('fade-out');
                    window.scrollTo(0, 0);
                }, 400);
            } catch (err) { console.error(err); }
        }

        init();
    </script>
</body>

</html>
